[build]
  command = "cd social && npm ci && npm run build"
  publish = "social/dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_SUPABASE_URL = "https://wbuipkeapzohtnlyxidv.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_XzEKSWN7Ar8Tf0txSZpaHA_j7rqoKLE"

# ── Root redirect → static app ──────────────────────────────────────────────
[[redirects]]
  from = "/"
  to = "/app/"
  status = 302

# ── Social PWA — asset pass-through (must come BEFORE the SPA catch-all) ───
[[redirects]]
  from = "/social/assets/*"
  to = "/assets/:splat"
  status = 200

# ── Social PWA — static data files ────────────────────────────────────────────
[[redirects]]
  from = "/social/wm-matches.json"
  to = "/wm-matches.json"
  status = 200

# ── Social PWA — SPA catch-all (all routes → React index.html) ──────────────
[[redirects]]
  from = "/social"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/social/*"
  to = "/index.html"
  status = 200

# ── Cache headers ────────────────────────────────────────────────────────────
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/flags/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/social-dist/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
